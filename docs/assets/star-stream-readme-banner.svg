<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" fill="none">
  <defs>
    <!-- Background gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0c1e3d" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#060f22" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#02050e" stop-opacity="1" />
    </radialGradient>
    <radialGradient id="cyanOrb" cx="25%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#02050e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="goldGlow" cx="78%" cy="55%" r="35%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#b45309" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#02050e" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradients for UI Elements -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="320" rx="14" fill="#02050e" />
  <rect width="1200" height="320" rx="14" fill="url(#bgGlow)" />
  <rect width="1200" height="320" rx="14" fill="url(#cyanOrb)" />
  <rect width="1200" height="320" rx="14" fill="url(#goldGlow)" />

  <!-- Background Grid & Coordinate lines -->
  <g stroke="#38bdf8" stroke-width="1" stroke-opacity="0.07" stroke-dasharray="4 8">
    <line x1="80" y1="0" x2="80" y2="320" />
    <line x1="280" y1="0" x2="280" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="920" y1="0" x2="920" y2="320" />
    <line x1="1120" y1="0" x2="1120" y2="320" />
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="260" x2="1200" y2="260" />
  </g>

  <!-- Orbital Geometry & Compass Circles -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.18">
    <circle cx="600" cy="160" r="130" stroke-dasharray="3 6" />
    <circle cx="600" cy="160" r="210" stroke-dasharray="2 10" />
    <circle cx="160" cy="80" r="90" stroke-dasharray="4 6" opacity="0.6" />
    <circle cx="1040" cy="240" r="110" stroke-dasharray="5 7" opacity="0.6" />
  </g>

  <!-- Star Map / Constellation Nodes & Links (Left Cluster - Incarnations) -->
  <g stroke="#38bdf8" stroke-width="1.2" opacity="0.35">
    <line x1="120" y1="90" x2="190" y2="60" />
    <line x1="190" y1="60" x2="240" y2="110" />
    <line x1="240" y1="110" x2="170" y2="170" />
    <line x1="170" y1="170" x2="120" y2="90" />
    <line x1="170" y1="170" x2="210" y2="230" />
    <line x1="240" y1="110" x2="310" y2="140" stroke-dasharray="3 3" opacity="0.6" />
  </g>
  <g fill="#e0f2fe">
    <circle cx="120" cy="90" r="2.5" />
    <circle cx="190" cy="60" r="3.5" fill="#38bdf8" filter="url(#subtleGlow)" />
    <circle cx="240" cy="110" r="4.5" fill="#ffffff" filter="url(#glow)" />
    <circle cx="170" cy="170" r="2.5" />
    <circle cx="210" cy="230" r="3" fill="#38bdf8" />
    <circle cx="310" cy="140" r="2" opacity="0.7" />
  </g>

  <!-- Star Map / Constellation Nodes & Links (Right Cluster - Great Nebulae) -->
  <g stroke="#38bdf8" stroke-width="1.2" opacity="0.35">
    <line x1="960" y1="110" x2="1030" y2="70" />
    <line x1="1030" y1="70" x2="1090" y2="130" />
    <line x1="1090" y1="130" x2="1050" y2="200" />
    <line x1="1050" y1="200" x2="980" y2="180" />
    <line x1="980" y1="180" x2="960" y2="110" />
    <line x1="1050" y1="200" x2="1110" y2="250" />
    <line x1="980" y1="180" x2="890" y2="170" stroke-dasharray="3 3" opacity="0.6" />
  </g>
  <g fill="#e0f2fe">
    <circle cx="960" cy="110" r="3" />
    <circle cx="1030" cy="70" r="4" fill="#fbbf24" filter="url(#subtleGlow)" />
    <circle cx="1090" cy="130" r="4.5" fill="#ffffff" filter="url(#glow)" />
    <circle cx="1050" cy="200" r="3" fill="#38bdf8" />
    <circle cx="980" cy="180" r="2.5" />
    <circle cx="1110" cy="250" r="2.5" fill="#38bdf8" />
    <circle cx="890" cy="170" r="2" opacity="0.7" />
  </g>

  <!-- Ambient Starfield Particles -->
  <g fill="#ffffff">
    <circle cx="70" cy="40" r="1" opacity="0.5" />
    <circle cx="150" cy="270" r="1.5" opacity="0.6" />
    <circle cx="270" cy="50" r="1" opacity="0.4" />
    <circle cx="340" cy="240" r="1.2" opacity="0.5" />
    <circle cx="430" cy="80" r="1.8" opacity="0.7" />
    <circle cx="480" cy="260" r="1" opacity="0.3" />
    <circle cx="720" cy="70" r="1.2" opacity="0.5" />
    <circle cx="760" cy="250" r="1.5" opacity="0.6" />
    <circle cx="840" cy="90" r="1" opacity="0.4" />
    <circle cx="910" cy="270" r="1.5" opacity="0.5" />
    <circle cx="1140" cy="60" r="1.2" opacity="0.6" />
    <circle cx="1160" cy="190" r="1" opacity="0.4" />
    <!-- Subtle Gold Stars -->
    <circle cx="390" cy="190" r="1.5" fill="#fbbf24" opacity="0.7" />
    <circle cx="820" cy="140" r="1.8" fill="#fbbf24" opacity="0.8" />
  </g>

  <!-- Outer Holographic Frame / System Window Borders -->
  <rect x="24" y="24" width="1152" height="272" rx="10" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.3" />
  <rect x="28" y="28" width="1144" height="264" rx="8" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.15" />

  <!-- Corner Brackets -->
  <g stroke="#38bdf8" stroke-width="2.5" stroke-linecap="square">
    <path d="M 20 44 L 20 20 L 44 20" />
    <path d="M 1180 44 L 1180 20 L 1156 20" />
    <path d="M 20 276 L 20 300 L 44 300" />
    <path d="M 1180 276 L 1180 300 L 1156 300" />
  </g>

  <!-- Top System Status Header Bar -->
  <g>
    <!-- Cyan pulsing beacon -->
    <circle cx="48" cy="46" r="3.5" fill="#38bdf8" filter="url(#glow)" />
    <text x="62" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="2.5">[ SYSTEM // STAR STREAM BROADCAST CHANNEL #8612 ]</text>
    <text x="1152" y="50" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="2">SCENARIO: ACTIVE // REGRESSION: 1,863</text>
  </g>

  <!-- Bottom Coordinates & System Telemetry -->
  <g>
    <line x1="48" y1="272" x2="1152" y2="272" stroke="url(#borderGrad)" stroke-width="1" />
    <text x="48" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#64748b" letter-spacing="2">COORDINATE: 37°33'59"N 126°58'41"E // SEOUL SUBWAY LINE 3</text>
    <text x="1152" y="288" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#38bdf8" letter-spacing="2">PROBABILITY STREAM: SYNCHRONIZED ◆</text>
  </g>

  <!-- Central Title Composition -->
  <!-- Subtle decorative horizontal accent brackets -->
  <text x="600" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="6">◆ &lt; THE FOURTH WALL &gt; ◆</text>

  <!-- Main Title: STAR STREAM -->
  <g filter="url(#glow)">
    <text x="600" y="172" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Space Grotesk', sans-serif" font-size="64" font-weight="900" fill="url(#textGrad)" letter-spacing="12">STAR STREAM</text>
  </g>

  <!-- Subtitle Tagline -->
  <text x="600" y="214" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#93c5fd" letter-spacing="7">AN ORV INTERACTIVE FAN EXPERIENCE</text>

  <!-- Small Lore Accent Line -->
  <text x="600" y="240" text-anchor="middle" font-family="Georgia, Cambria, 'Times New Roman', serif" font-style="italic" font-size="12" fill="#cbd5e1" opacity="0.75" letter-spacing="1">"You were the only one who read to the very last line."</text>
</svg>
