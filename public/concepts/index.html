<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Stream — Constellation Atlas Concepts Review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #02040a;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .serif { font-family: 'Instrument Serif', Georgia, serif; }

    /* Concept Navigation Header */
    .concept-nav {
      background: #030712;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 50;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .tag {
      font-size: 9px;
      letter-spacing: 0.2em;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 3px 8px;
      border-radius: 4px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.06);
    }
    .tab-btn.active {
      color: #ffffff;
      background: #0284c7;
      box-shadow: 0 0 12px rgba(2, 132, 199, 0.4);
    }

    /* Content Area */
    .content-area {
      flex: 1;
      width: 100%;
      height: calc(100vh - 56px);
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }
    iframe.active {
      display: block;
    }

    /* Split View Container */
    .split-view {
      display: none;
      width: 100%;
      height: 100%;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      background: #0f172a;
    }
    .split-view.active {
      display: grid;
    }
    .split-pane {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: #010308;
      position: relative;
    }
    .split-pane-header {
      padding: 8px 12px;
      background: #030712;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .split-pane iframe {
      display: block;
      flex: 1;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <header class="concept-nav">
    <div class="brand">
      <span class="tag mono">DESIGN REVIEW</span>
      <h2 class="serif" style="font-size: 19px; font-weight: normal; color: #f8fafc;">Star Stream Constellation Atlas · Visual Direction Candidates</h2>
    </div>

    <nav class="tabs">
      <button class="tab-btn active" onclick="switchView('a', this)">Concept A: Celestial Atlas</button>
      <button class="tab-btn" onclick="switchView('b', this)">Concept B: Cosmic Manuscript</button>
      <button class="tab-btn" onclick="switchView('c', this)">Concept C: Living Star Stream</button>
      <button class="tab-btn" onclick="switchView('split', this)">Side-by-Side Comparison</button>
    </nav>

    <div class="mono" style="font-size: 10px; color: #64748b;">
      ESC: RETURN TO ATLAS // VIEWPORT: 1440 × 900
    </div>
  </header>

  <main class="content-area">
    <iframe id="frame-a" class="active" src="concept-a.html"></iframe>
    <iframe id="frame-b" src="concept-b.html"></iframe>
    <iframe id="frame-c" src="concept-c.html"></iframe>

    <div id="view-split" class="split-view">
      <div class="split-pane">
        <div class="split-pane-header mono">
          <span style="color: #38bdf8;">CONCEPT A // CELESTIAL ATLAS</span>
          <span style="color: #64748b;">Discrete Asterisms</span>
        </div>
        <iframe src="concept-a.html"></iframe>
      </div>
      <div class="split-pane">
        <div class="split-pane-header mono">
          <span style="color: #c084fc;">CONCEPT B // COSMIC MANUSCRIPT</span>
          <span style="color: #64748b;">Graticules &amp; Editorial</span>
        </div>
        <iframe src="concept-b.html"></iframe>
      </div>
      <div class="split-pane">
        <div class="split-pane-header mono">
          <span style="color: #f43f5e;">CONCEPT C // LIVING STAR STREAM</span>
          <span style="color: #64748b;">Deep Space Photometry</span>
        </div>
        <iframe src="concept-c.html"></iframe>
      </div>
    </div>
  </main>

  <script>
    function switchView(view, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      document.querySelectorAll('iframe, .split-view').forEach(el => el.classList.remove('active'));

      if (view === 'split') {
        document.getElementById('view-split').classList.add('active');
      } else {
        document.getElementById('frame-' + view).classList.add('active');
      }
    }
  </script>
</body>
</html>
